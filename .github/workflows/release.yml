# Automated SemVer releases via semantic-release (Refs #10),
# mirroring rcasia/neotest-java.
#
# Runs on every push to main (or on demand via workflow_dispatch): after
# the test suite passes, npx semantic-release derives the next version
# from Conventional Commits on main (feat -> minor, fix/refactor/perf
# -> patch, BREAKING CHANGE -> major), creates the vMAJOR.MINOR.PATCH
# tag + GitHub Release, and then we move the floating vMAJOR /
# vMAJOR.MINOR tags (computed by scripts/release.sh) so users can pin
# `uses: ...@v1` (or `@v0` while 0.x).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [test]
    name: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install semantic-release
        run: npm install --no-save semantic-release @semantic-release/release-notes-generator conventional-changelog-conventionalcommits@^7.0.0
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Move floating tags
        run: |
          git fetch --tags origin
          NEW_TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          if [ -z "$NEW_TAG" ]; then
            echo "no new stable release published; nothing to float"
            exit 0
          fi
          ./scripts/release.sh "$NEW_TAG"
          FLOATS="$(grep '^float-tags=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
          # Unquoted $FLOATS: intentional word-splitting of the tag list.
          for float in $FLOATS; do
            git tag -f "$float" "$NEW_TAG"
            git push -f origin "$float"
          done
