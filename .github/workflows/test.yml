# CI for lua-mutation-test-action (Track 4; refs #11).
#
# - unit: bashunit suite on ubuntu + macOS.
# - lint: shellcheck + shfmt check over scripts/ and tests/.
# - actionlint: static checks for all workflows.
# - smoke: runs the local action (uses: ./) against fixtures/sample with a
#   STUBBED lmut on PATH, so the test is deterministic and offline; asserts
#   the step outputs and the job-summary content.
#
# Guards that skip when a directory/file is absent keep this file green
# before Tracks 1-3 land; they can be simplified once action.yml,
# scripts/, and tests/ exist.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: bashunit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Run bashunit suite
        run: |
          if compgen -G 'tests/*_test.sh' > /dev/null; then
            ./lib/bashunit tests
          else
            echo "no bashunit tests yet — skipping"
          fi

  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck scripts and tests
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "no shell files yet — skipping"
          fi

      - name: Check shfmt formatting
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          dirs=()
          for d in scripts tests; do
            [ -d "$d" ] && dirs+=("$d")
          done
          if [ "${#dirs[@]}" -gt 0 ]; then
            out="$("$RUNNER_TEMP/bin/shfmt" -l "${dirs[@]}")"
            if [ -n "$out" ]; then
              echo "$out"
              echo "shfmt: files above need formatting"
              exit 1
            fi
          else
            echo "no shell dirs yet — skipping"
          fi

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # action.yml lands in Track 1 — steps using the local action skip until
    # it exists (hashFiles is only allowed in step-level `if`, not job-level).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install stub lmut (deterministic, offline)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/lmut" <<'EOF'
          #!/bin/sh
          # Stub lmut for smoke tests: deterministic canned output.
          echo 'Mutation score: 50.0% (1 killed, 1 survived, 0 timed out)'
          echo 'Survived: fixtures/sample/lua/add.lua:12:3 — changed `or` to `and`'
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/lmut"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"

      - name: Run local action against fixture
        id: mutation
        if: ${{ hashFiles('action.yml') != '' }}
        uses: ./
        with:
          path: fixtures/sample
          test-command: busted

      - name: Assert outputs and summary
        if: ${{ hashFiles('action.yml') != '' }}
        run: |
          test "${{ steps.mutation.outputs.mutation-score }}" = "50.0" || { echo "wrong mutation-score: ${{ steps.mutation.outputs.mutation-score }}"; exit 1; }
          test "${{ steps.mutation.outputs.killed }}" = "1" || { echo "wrong killed: ${{ steps.mutation.outputs.killed }}"; exit 1; }
          test "${{ steps.mutation.outputs.survived }}" = "1" || { echo "wrong survived: ${{ steps.mutation.outputs.survived }}"; exit 1; }
          grep -qi "mutation score" "$GITHUB_STEP_SUMMARY"
